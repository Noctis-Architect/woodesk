name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build with PyInstaller and Inno Setup
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1
        env:
          WOODESK_SERVER_URL: ${{ secrets.WOODESK_SERVER_URL }}

      - name: Compress portable folder
        run: Compress-Archive -Path dist/WooDesk -DestinationPath dist/WooDesk-windows.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WooDesk-windows
          path: |
            dist/WooDesk-Setup.exe
            dist/WooDesk-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Build with PyInstaller
        run: bash packaging/build_linux.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WooDesk-linux
          path: dist/WooDesk-linux.tar.gz

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/WooDesk-windows/WooDesk-Setup.exe
            artifacts/WooDesk-windows/WooDesk-windows.zip
            artifacts/WooDesk-linux/WooDesk-linux.tar.gz
